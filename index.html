        <!-- Feature 1: AI Study Summarizer (Text & Image Upload) -->
        <section id="study" class="card">
            <h2>🧠 AI Study Summarizer (Teks & Foto)</h2>
            <p>Masukkan teks materi atau unggah foto catatan/buku pelajaranmu untuk dirangkum otomatis.</p>
            
            <!-- Tab Pilihan Input (Teks vs Foto) -->
            <div class="tab-container">
                <button class="tab-btn active" onclick="switchTab('text')">Ketik/Tempel Teks</button>
                <button class="tab-btn" onclick="switchTab('image')">Unggah Foto Buku</button>
            </div>

            <!-- Input Teks -->
            <div id="textTabContent" class="tab-content active">
                <textarea id="inputText" placeholder="Tempel materi pelajaran di sini..."></textarea>
            </div>

            <!-- Input Foto -->
            <div id="imageTabContent" class="tab-content" style="display: none;">
                <div class="upload-dropzone" id="dropzone">
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    <div id="uploadLabel" onclick="document.getElementById('imageInput').click()" style="cursor: pointer;">
                        📷 <strong>Klik untuk unggah foto</strong> atau seret gambar ke sini<br>
                        <span style="font-size: 0.85rem; color: var(--text-muted);">(Format: JPG, PNG)</span>
                    </div>
                    <!-- Preview Gambar -->
                    <div id="imagePreviewContainer" style="display: none; margin-top: 10px;">
                        <img id="imagePreview" src="" alt="Preview Foto" style="max-width: 100%; max-height: 150px; border-radius: 8px;">
                        <br>
                        <button type="button" id="removeImageBtn" style="margin-top: 5px; background: #ef4444; padding: 0.3rem 0.6rem; font-size: 0.8rem;">Hapus Foto</button>
                    </div>
                </div>
            </div>

            <button id="summarizeBtn" style="margin-top: 1rem;">Rangkum Materi</button>
            <div id="outputResult" class="output-box">Hasil rangkuman akan muncul di sini...</div>
        </section>
